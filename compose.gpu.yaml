# Run the model server on an NVIDIA GPU (x86_64 or arm64). Needs the NVIDIA Container Toolkit with CDI:
# "docker info" must show the device nvidia.com/gpu=all.
# Use: put COMPOSE_FILE=compose.yaml:compose.gpu.yaml in .env, then docker compose up -d.

services:
  llama:
    # A fixed build. The build of server-cuda from November 2026 gave poor answers with the bundled model on this
    # GPU. Test the answers of the assistant before you change the build.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b11515
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
