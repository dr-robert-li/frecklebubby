[project]
name = "frecklebubby"
version = "0.1.0"
description = "Self-hosted baby tracker with REST API and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "fastmcp>=2.13",
    "pywebpush>=2.0",
    "python-multipart>=0.0.20",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
frecklebubby = "frecklebubby.main:run"
frecklebubby-mcp = "frecklebubby.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: needs a real model server (env LLM_LIVE_URL)", "network: needs the internet (env NETWORK_TESTS=1)"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
