[project]
name = "crykit"
version = "0.1.0"
description = "Training kit for the Frecklebubby cry detector and cry-reason model"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "soundfile>=0.13",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "sed-eval>=0.2.1",
    "psds-eval>=0.5.3",
    "transformers>=4.50",
]

[project.optional-dependencies]
# Pick one: `uv sync --extra cpu` (no GPU) or `uv sync --extra gpu` (NVIDIA, CUDA 12.8).
cpu = ["torch>=2.6", "torchaudio>=2.6", "torchvision>=0.21"]
gpu = ["torch>=2.6", "torchaudio>=2.6", "torchvision>=0.21"]

[project.scripts]
crykit = "crykit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu128", extra = "gpu" }]
torchaudio = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu128", extra = "gpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu128", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
